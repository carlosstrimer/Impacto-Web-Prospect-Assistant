<!-- FILE: popup.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Impacto Web Prospect Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0b0d; color: #f5f5f7; padding: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #fff, #a1a1aa); color: #0b0b0d; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
    .brand-name { font-weight: 700; font-size: 14px; }
    .brand-sub { font-size: 11px; color: #a1a1aa; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { background: #17171b; border: 1px solid #26262c; border-radius: 8px; padding: 10px; }
    .stat-value { font-size: 20px; font-weight: 700; }
    .stat-label { font-size: 11px; color: #a1a1aa; margin-top: 2px; }
    button { width: 100%; padding: 11px; border-radius: 8px; border: none; background: #fff; color: #0b0b0d; font-weight: 600; font-size: 13px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .hint { font-size: 11px; color: #71717a; margin-top: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo">IW</div>
    <div>
      <div class="brand-name">Impacto Web</div>
      <div class="brand-sub">Prospect Assistant</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Leads</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statMsgs">0</div>
      <div class="stat-label">Mensagens</div>
    </div>
  </div>
  <button id="openDashboard">Abrir Painel Completo</button>
  <div class="hint">Importe CSVs/JSONs exportados pelo Lead Finder. Tudo é processado localmente.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
